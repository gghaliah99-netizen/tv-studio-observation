<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Studio Challenge</title><style>:root{font-family:Arial,sans-serif;color:#f8f8ff;background:#10152b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#34315b,#10152b 75%)}main{max-width:1050px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{border:1px solid #b6a0ff;border-radius:50px;padding:9px 15px;color:#e5dbff}.screen{background:#202544;border:1px solid #57577c;border-radius:24px;padding:clamp(20px,5vw,55px);min-height:440px;margin-top:20px;box-shadow:0 20px 55px #0005}h1{font-size:clamp(32px,5vw,58px);color:#ffd77c;margin:14px 0}h2{font-size:clamp(26px,4vw,42px);margin:12px 0 22px}p,li{font-size:clamp(19px,2.4vw,25px);line-height:1.55}.sub{color:#c5c8e5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{padding:20px;border-radius:16px;background:#31375c;border:1px solid #686e98;font-size:21px}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:25px}button{font-size:19px;cursor:pointer;border:0;border-radius:13px;padding:14px 19px;background:#ffda82;color:#1d2038;font-weight:bold;min-height:49px}button.secondary{background:#525b89;color:white}button:focus-visible{outline:3px solid white}button:disabled{opacity:.4}.choice{display:block;width:100%;text-align:left;background:#363f68;color:white;margin:10px 0}.choice.good{background:#14694f}.choice.bad{background:#793d53}.feedback{min-height:40px;font-size:20px;color:#ffda82;margin-top:16px}.small{font-size:16px}.stage{color:#e6bfff;font-weight:bold;letter-spacing:2px}footer{padding:16px;text-align:center;color:#b4b8d4}.progress{height:7px;background:#3d4164;border-radius:20px;overflow:hidden;margin-top:20px}.progress div{height:100%;background:#ffda82;transition:width .2s}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:600px){.two{grid-template-columns:1fr}}input,textarea{width:100%;font-size:20px;padding:13px;border-radius:10px;border:1px solid #b9b5df;background:#151b34;color:white}label{display:block;margin:12px 0}.badge{background:#6b4984;border-radius:30px;padding:6px 14px;display:inline-block}.teacherbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}.teacherbar button{font-size:15px;padding:9px 12px;min-height:40px}.scoreboard{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:7px;margin-top:12px}.team{background:#31375c;border:1px solid #686e98;border-radius:12px;padding:8px;text-align:center}.team strong{display:block;font-size:21px;color:#ffda82}.team button{font-size:16px;min-height:34px;padding:5px 10px;margin:3px}.timer{font-size:22px;color:#ffda82;font-weight:bold}.hiddenpanel[hidden]{display:none}.answer{margin-top:12px;padding:15px;border:1px solid #8e8ac2;border-radius:12px;background:#292e52;font-size:21px}.screen .card button{font-size:16px;margin-top:8px}.teacherbar label{margin:0;font-size:16px}.teacherbar input{width:80px;font-size:16px;padding:8px}.preclass{background:#31375c;padding:15px;border-radius:12px}@media(max-width:650px){.scoreboard{grid-template-columns:repeat(3,minmax(80px,1fr))}}@media print{.teacherbar,.scoreboard,.buttons{display:none}}</style></head><body><main><div class="top"><div class="pill">🎬 MEGA GOAL 2 • UNIT 4</div><div class="pill" id="counter">STUDIO 1 / 12</div></div><div class="progress"><div id="bar"></div></div><div class="teacherbar"><button class="secondary" id="teamsToggle" aria-expanded="false">🏆 Team Scores</button><button class="secondary" id="timerToggle" aria-expanded="false">⏱️ Activity Timer</button><span id="timerPanel" hidden><label>Minutes <input type="number" id="minutes" value="3" min="1" max="30"></label> <span class="timer" id="clock">03:00</span> <button id="startTimer">Start / Pause</button> <button class="secondary" id="resetTimer">Reset</button></span></div><div id="scores" class="scoreboard" hidden></div><section class="screen" id="screen" aria-live="polite"></section><div class="buttons"><button class="secondary" id="prev">← Previous</button><button id="next">Next studio →</button><button class="secondary" id="home">⌂ Home</button></div><footer>Teacher: Ghaliah Al-Shamrani • 1448 H</footer></main><script>
const slides=[
{tag:'WELCOME • 2 MIN',title:'📺 The TV Studio Challenge',body:`<p>Lights on. Cameras ready. English in action!</p><p class="sub">Today you are presenters, viewers, and TV critics.</p><span class="badge">Think • Vote • Explain • Reveal</span><div class="preclass"><p class="small"><strong>Before class (Teams):</strong> Preview the conversation and choose one TV show you would recommend. Be ready to explain why.</p></div>`},
{tag:'LEARNING GOALS • 2 MIN',title:'🎯 Our Mission',body:`<div class="grid"><div class="card">Follow a TV conversation</div><div class="card">Use Real Talk phrases</div><div class="card">Express certainty</div><div class="card">Listen for key details</div><div class="card">Say gonna / wanna</div><div class="card">Use new vocabulary</div></div>`},
{tag:'WARM-UP • 3 MIN',title:'🎤 Which TV show?',body:`<p>Which show would you watch?</p><div class="grid"><div class="card">🍳 Cooking competition</div><div class="card">🏆 Quiz show</div><div class="card">🎭 Drama</div></div><p class="sub">Think individually → share with a partner → explain your choice.</p>`},
{tag:'CONVERSATION • 6 MIN',title:'🎭 Asma & Noura',body:`<div class="two"><div class="card"><h2>Asma 🙄</h2><p>“It's boring!”</p><p>She dislikes the cooking competition.</p></div><div class="card"><h2>Noura 😄</h2><p>“I get a kick out of it.”</p><p>She enjoys the show.</p></div></div><p>Contestants prepare a four-course meal for judges.</p><button class="secondary" data-reveal="conv">Reveal the question</button><div id="conv" hidden><p>Why do Asma and Noura disagree? Give evidence from the conversation. <strong>Teacher prompt:</strong> Invite two different explanations before confirming.</p></div>`},
{tag:'REAL TALK • 5 MIN',title:'💬 Match the Expressions',body:`<div class="grid"><div class="card">get a kick out of</div><div class="card">bugs me</div><div class="card">remote</div><div class="card">all</div><div class="card">C’mon</div><div class="card">couch potato</div><div class="card">Nah</div></div><p class="sub">Think → Pair → Vote. What does each expression mean?</p><button class="secondary" data-reveal="realtalk">Reveal meanings</button><div id="realtalk" class="answer" hidden>get a kick out of = enjoy • bugs me = annoys me • remote = remote control • all = completely • C’mon = Come on • couch potato = a person who watches too much TV • Nah = No</div><p>Pair work: make a new sentence using one expression.</p>`},
{tag:'QUICK CHECK • 3 MIN',title:'🎯 Real Talk Challenge',quiz:{q:'“I get a kick out of it” means… <span class="small">(Vote first, then reveal.)</span>',options:['I enjoy it.','It annoys me.','I do not understand.','I want to leave.'],answer:0,why:'“Get a kick out of” means to enjoy something.'}},
{tag:'SPEAKING • 4 MIN',title:'🎙️ Expressing Certainty',body:`<div class="grid"><div class="card">I'm sure / certain / positive that…</div><div class="card">There's no question that…</div><div class="card">It's obvious that…</div><div class="card">I'm telling you that…</div></div><p>Role-play: One student recommends a show. Her partner responds using a certainty phrase.</p>`},
{tag:'LISTENING • 6 MIN',title:'🎧 Quiz Show: Imad',body:`<p>Listen to the conversation between the quiz-show host and Imad.</p><div class="two"><div class="card"><strong>Positive impact</strong><p>Write details that help Imad's performance.</p><textarea rows="3" aria-label="Positive impacts"></textarea></div><div class="card"><strong>Negative impact</strong><p>Write details that hurt his performance.</p><textarea rows="3" aria-label="Negative impacts"></textarea></div></div><p class="small">Play the textbook audio supplied by your school. No recording is included in this package.</p>`},
{tag:'PRONUNCIATION • 4 MIN',title:'🗣️ Gonna or Wanna?',body:`<div class="two"><div class="card"><h2>going to → gonna</h2><p>I'm gonna try.</p></div><div class="card"><h2>want to → wanna</h2><p>I wanna win.</p></div></div><p>Say it formally, then casually. Which version fits a formal presentation?</p><p class="small">These are casual spoken reductions; use standard forms in formal writing.</p>`},
{tag:'VOCABULARY • 5 MIN',title:'🧩 Word Detective',body:`<div class="grid"><div class="card">evolution</div><div class="card">distinct</div><div class="card">prototype</div><div class="card">transmit</div><div class="card">patent</div><div class="card">milestone</div><div class="card">affluence</div></div><p class="sub">Ask groups to predict meanings before revealing.</p><button class="secondary" data-reveal="wordkeys">Reveal word meanings</button><div id="wordkeys" class="answer" hidden>evolution = gradual development • distinct = clearly different • prototype = test model • transmit = send out • patent = legal invention right • milestone = important event • affluence = wealth</div><p>Choose one word and use it in your own sentence.</p>`},
{tag:'VALUES & REAL LIFE • 3 MIN',title:'🇸🇦 Positive Media, Positive Impact',body:`<p>How can Saudi TV programs share our culture and values with the world?</p><p class="sub">In groups: suggest one respectful and educational TV program idea. Every voice matters.</p><div class="card">Listen respectfully • Encourage teammates • Celebrate different ideas</div>`},
{tag:'EXIT TICKET • 2 MIN',title:'🎟️ You’re On Air!',body:`<p>Complete these three mini-missions:</p><label>1. One Real Talk expression I learned:<input placeholder="Write an expression"></label><label>2. Complete: I'm sure that…<input placeholder="Your sentence"></label><label>3. In casual speech, “want to” sounds like…<input placeholder="Your answer"></label><button id="checkExit">Check my learning</button><div id="exitFeedback" class="feedback"></div>`}
];let idx=0,answered={};let teamScores=[0,0,0,0,0,0],seconds=180,timerRunning=false,timerHandle=null;const scoreEl=document.getElementById('scores'),timerPanel=document.getElementById('timerPanel');function drawScores(){scoreEl.innerHTML=teamScores.map((n,i)=>`<div class="team">Team ${i+1}<strong>${n}</strong><button aria-label="Add point to team ${i+1}" data-team="${i}" data-delta="1">+</button><button aria-label="Remove point from team ${i+1}" data-team="${i}" data-delta="-1">−</button></div>`).join('');scoreEl.querySelectorAll('button').forEach(b=>b.onclick=()=>{const t=Number(b.dataset.team);teamScores[t]=Math.max(0,teamScores[t]+Number(b.dataset.delta));drawScores()})}drawScores();document.getElementById('teamsToggle').onclick=()=>{scoreEl.hidden=!scoreEl.hidden;document.getElementById('teamsToggle').setAttribute('aria-expanded',String(!scoreEl.hidden))};function clockDraw(){document.getElementById('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}function stopTimer(){timerRunning=false;if(timerHandle!==null){clearInterval(timerHandle);timerHandle=null}}document.getElementById('timerToggle').onclick=()=>{timerPanel.hidden=!timerPanel.hidden;document.getElementById('timerToggle').setAttribute('aria-expanded',String(!timerPanel.hidden))};document.getElementById('startTimer').onclick=()=>{if(timerRunning){stopTimer();return}if(seconds===0){seconds=Math.max(1,Math.min(30,Number(document.getElementById('minutes').value)||3))*60}timerRunning=true;timerHandle=setInterval(()=>{seconds=Math.max(0,seconds-1);clockDraw();if(seconds===0){stopTimer();document.getElementById('clock').textContent='Time is up!'}},1000)};document.getElementById('resetTimer').onclick=()=>{stopTimer();seconds=Math.max(1,Math.min(30,Number(document.getElementById('minutes').value)||3))*60;clockDraw()};clockDraw();const screen=document.getElementById('screen');function render(){const s=slides[idx];document.getElementById('counter').textContent=`STUDIO ${idx+1} / ${slides.length}`;document.getElementById('bar').style.width=((idx+1)/slides.length*100)+'%';let html=`<div class="stage">${s.tag}</div><h1>${s.title}</h1>`;if(s.quiz){html+=`<p>${s.quiz.q}</p>`+s.quiz.options.map((x,i)=>`<button class="choice" data-option="${i}">${String.fromCharCode(65+i)}. ${x}</button>`).join('')+`<div class="feedback" id="feedback"></div>`}else html+=s.body;screen.innerHTML=html;document.getElementById('prev').disabled=idx===0;document.getElementById('next').disabled=idx===slides.length-1;screen.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{let n=Number(b.dataset.option),correct=n===s.quiz.answer;screen.querySelectorAll('[data-option]').forEach(c=>{c.disabled=true;if(Number(c.dataset.option)===s.quiz.answer)c.classList.add('good');else if(c===b)c.classList.add('bad')});document.getElementById('feedback').textContent=(correct?'✓ Correct. ':'Not quite. ')+s.quiz.why}));screen.querySelectorAll('[data-reveal]').forEach(b=>b.addEventListener('click',()=>{let x=document.getElementById(b.dataset.reveal);x.hidden=!x.hidden}));const exit=screen.querySelector('#checkExit');if(exit)exit.addEventListener('click',()=>{let values=[...screen.querySelectorAll('input')].map(x=>x.value.trim());document.getElementById('exitFeedback').textContent=values.every(Boolean)?'Great effort! Discuss your answers with your teacher.':'Please complete all three responses first.'});}document.getElementById('next').onclick=()=>{if(idx<slides.length-1){idx++;render()}};document.getElementById('prev').onclick=()=>{if(idx>0){idx--;render()}};document.getElementById('home').onclick=()=>{idx=0;render()};render();</script></body></html>
